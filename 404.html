<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>페이지를 찾을 수 없습니다 | 여행정보엑스퍼트</title>
  <meta name="description" content="요청한 페이지를 찾을 수 없습니다. 여행정보엑스퍼트의 여행 가이드와 사이트 안내를 확인해 주세요.">
  <style>
    :root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#17212b;background:#f7f9f8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column}
    a{color:#176b79;text-underline-offset:3px}
    a:focus-visible{outline:3px solid #176b79;outline-offset:4px}
    header,main,footer{width:100%}
    .inner{max-width:1080px;margin:0 auto;padding:0 24px}
    header{border-bottom:1px solid #dce4e2;background:#fff}
    header .inner{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{font-size:19px;font-weight:800;color:#17212b;text-decoration:none}
    nav{display:flex;flex-wrap:wrap;gap:16px;font-size:14px}
    main{flex:1;display:grid;align-items:center}
    main .inner{padding-top:64px;padding-bottom:80px}
    .status{font-size:14px;font-weight:800;color:#176b79;margin:0 0 12px}
    h1{font-size:clamp(28px,4vw,42px);line-height:1.25;margin:0 0 16px;letter-spacing:0}
    p{font-size:16px;line-height:1.7;max-width:650px;margin:0 0 26px;color:#4c5b62}
    .links{display:flex;flex-wrap:wrap;gap:12px}
    .links a{display:inline-flex;align-items:center;min-height:44px;padding:10px 15px;border:1px solid #b9d3d5;border-radius:6px;background:#fff;text-decoration:none;font-weight:700}
    .links a:first-child{background:#176b79;border-color:#176b79;color:#fff}
    footer{border-top:1px solid #dce4e2;background:#fff}
    footer .inner{padding-top:24px;padding-bottom:24px;display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;font-size:13px;color:#59676c}
    @media(max-width:560px){header .inner{align-items:flex-start;flex-direction:column;padding-top:18px;padding-bottom:18px}main .inner{padding-top:50px;padding-bottom:60px}}
  </style>
</head>
<body>
  <header><div class="inner">
    <a class="brand" href="/">여행정보엑스퍼트</a>
    <nav aria-label="주요 메뉴"><a href="/travel-tips/">여행 팁</a><a href="/asia-travel/">아시아</a><a href="/europe-travel/">유럽</a><a href="/about/">사이트 소개</a></nav>
  </div></header>
  <main><div class="inner">
    <p class="status">404 · 페이지 없음</p>
    <h1>요청한 페이지를 찾을 수 없습니다.</h1>
    <p>주소가 바뀌었거나 게시가 종료된 페이지일 수 있습니다. 아래에서 현재 제공하는 여행 정보를 찾아보세요.</p>
    <div class="links"><a href="/">홈으로 가기</a><a href="/travel-tips/">여행 가이드 보기</a><a href="/contact/">문의하기</a></div>
  </div></main>
  <footer><div class="inner"><span>© 여행정보엑스퍼트</span><span><a href="/privacy-policy/">개인정보 처리방침</a> · <a href="/terms-of-service/">이용약관</a></span></div></footer>
</body>
</html>
